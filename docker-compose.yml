services:
  mysql:
    image: mysql:8.4
    container_name: aihub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: aihub
      MYSQL_USER: aihub
      MYSQL_PASSWORD: aihubpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aihub-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      DB_NAME: aihub
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_EMAIL: admin@aihub.local
      ADMIN_PASSWORD: Admin@12345
      ADMIN_NAME: Admin
      UPLOAD_DIR: /app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        API_PROXY_ORIGIN: http://backend:4000
    container_name: aihub-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      API_INTERNAL_URL: http://backend:4000/api
      API_PROXY_ORIGIN: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  uploads-data:
